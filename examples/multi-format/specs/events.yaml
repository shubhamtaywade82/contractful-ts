asyncapi: 2.6.0
info:
  title: Shop Events
  version: 1.4.0
servers:
  production:
    url: wss://events.shop.test/ws
    protocol: wss
channels:
  order.created:
    description: Fires when an order is created.
    publish:
      message:
        name: OrderCreated
        payload:
          type: object
          properties:
            orderId: { type: string, minLength: 1 }
            total: { type: number, minimum: 0 }
          required: [orderId]
  order/{orderId}/shipped:
    description: Per-order shipping notifications.
    parameters:
      orderId:
        schema: { type: string, minLength: 1 }
    publish:
      message:
        name: OrderShipped
        payload:
          type: object
          properties:
            carrier: { type: string }
            eta: { type: string }
          required: [carrier]
  order.cancel:
    description: Clients publish cancellations for open orders.
    subscribe:
      message:
        name: CancelOrder
        payload:
          type: object
          properties:
            orderId: { type: string, minLength: 1 }
            reason: { type: string }
          required: [orderId]
