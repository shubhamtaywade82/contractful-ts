asyncapi: 2.6.0
info:
  title: Shop Events
  version: 1.4.0
servers:
  production:
    url: wss://events.shop.test/ws
    protocol: wss
channels:
  order.created:
    description: Fires when an order is created.
    x-client-domain: orders
    x-client-event-name: orderCreated
    publish:
      message:
        name: OrderCreated
        payload:
          type: object
          properties:
            orderId: { type: string, minLength: 1 }
            total: { type: number, minimum: 0 }
          required: [orderId]
  order/{orderId}/shipped:
    description: Per-order shipping notifications.
    parameters:
      orderId:
        schema: { type: string, minLength: 1 }
    publish:
      message:
        name: OrderShipped
        payload:
          type: object
          properties:
            carrier: { type: string }
            eta: { type: string }
          required: [carrier]
  product.events:
    description: Product lifecycle events fanned over one channel.
    publish:
      message:
        oneOf:
          - name: ProductCreated
            payload:
              type: object
              properties:
                productId: { type: string, minLength: 1 }
                title: { type: string }
              required: [productId]
          - name: ProductPriceChanged
            payload:
              type: object
              properties:
                productId: { type: string, minLength: 1 }
                price: { type: number, minimum: 0 }
              required: [productId, price]
  order.cancel:
    description: Clients publish cancellations for open orders.
    subscribe:
      message:
        name: CancelOrder
        payload:
          type: object
          properties:
            orderId: { type: string, minLength: 1 }
            reason: { type: string }
          required: [orderId]
