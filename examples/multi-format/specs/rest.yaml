openapi: 3.0.3
info:
  title: Shop REST API
  version: 1.4.0
servers:
  - url: https://api.shop.test/v1
security:
  - BearerAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.shop.test/oauth/token
          scopes:
            orders:read: Read orders
            orders:write: Write orders
paths:
  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: List products
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema: { type: array }
  /products/{productId}:
    get:
      tags: [products]
      operationId: showProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: One product, content: { application/json: { schema: { type: object } } } }
        '404': { description: Not found }
  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      security:
        - OAuth2: [orders:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId: { type: string, minLength: 1 }
                quantity: { type: integer, minimum: 1, maximum: 99 }
              required: [productId, quantity]
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
        '422': { description: Validation error }
  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: showOrder
      security:
        - OAuth2: [orders:read]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: One order, content: { application/json: { schema: { type: object } } } }
  /admin/stats:
    get:
      tags: [misc]
      operationId: getAdminStats
      x-client-domain: admin
      responses:
        '200': { description: Aggregate stats, content: { application/json: { schema: { type: object } } } }
