name: Release

on:
  push:
    tags: ['v*']
  # Manual re-release of an existing tag — no tag deletion/re-push needed
  # (e.g. when NPM_TOKEN was missing or the registry hiccuped on first run).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0) — required for manual runs'
        required: false
        default: ''
      skip_publish:
        description: 'Verify + draft release only, skip npm publish'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.ref.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine the ref to release
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              echo "::error::Manual dispatch requires the 'tag' input (e.g. v0.4.0)."
              exit 1
            fi
            TAG="${TAG#refs/tags/}"
            echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag must match package.json version
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${VERSION} (expected v${VERSION})."
            exit 1
          fi

  verify:
    name: Verify release artifact (Node ${{ matrix.node }})
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc, strict)
        run: npm run build

      - name: Typecheck (src + compile-time test contracts)
        run: npm run typecheck

      - name: Test (vitest)
        run: npx vitest run

  release:
    name: GitHub Release + npm publish
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack tarball for the release assets
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: contractful-ts-*.tgz
          tag_name: ${{ needs.resolve.outputs.tag }}

      # Publishes only when the NPM_TOKEN secret is configured; otherwise
      # the draft release reminds you to publish manually (see RELEASING.md).
      # (The secrets context cannot be referenced from a step-level `if:`
      # expression, so the guard lives in the shell.) Re-running the workflow
      # is safe: a version already on npm is skipped instead of failing E409.
      - name: Publish to npm (when NPM_TOKEN is configured)
        env:
          SKIP_PUBLISH: ${{ inputs.skip_publish }}
          VERSION: ${{ needs.resolve.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$SKIP_PUBLISH" = "true" ]; then
            echo "skip_publish requested — draft release only."
            exit 0
          fi
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not configured — skipping npm publish."
            echo "Publish manually per RELEASING.md, then finalize the draft release."
            exit 0
          fi
          if npm view "contractful-ts@${VERSION}" version >/dev/null 2>&1; then
            echo "contractful-ts@${VERSION} is already on npm — skipping publish (idempotent re-release)."
            exit 0
          fi
          npm publish --access public
