name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: Verify release artifact (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc, strict)
        run: npm run build

      - name: Typecheck (src + compile-time test contracts)
        run: npm run typecheck

      - name: Test (vitest)
        run: npx vitest run

  release:
    name: GitHub Release + npm publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack tarball for the release assets
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: contractful-ts-*.tgz

      # Publishes only when the NPM_TOKEN secret is configured; otherwise
      # the draft release reminds you to publish manually (see RELEASING.md).
      # (The secrets context cannot be referenced from a step-level `if:`
      # expression, so the guard lives in the shell.)
      - name: Publish to npm (when NPM_TOKEN is configured)
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not configured — skipping npm publish."
            echo "Publish manually per RELEASING.md, then finalize the draft release."
            exit 0
          fi
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
